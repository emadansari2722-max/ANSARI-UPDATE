<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ANSARI CHEATS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>

    let selectedPosition = '';
    let headshotEnabled = false;
    let sniperEnabled = false;
    let aimbotVersion = 'version-1';
    let isTabOpen = false;

    let hotkeyEnabled = false;
    let pressedKeys = new Set();
    let hotkeyStates = {
      aimbot: false,
      sniperScope: false,
      sniperSwitch: false
    };
    let keybinds = {
      aimbot: 'F4',
      sniperScope: 'F5',
      sniperSwitch: 'F6'
    };

    let dragEnabled = false;
let dragKey = 'left';
let dragDelay = 0;
let dragSpeed = 10;



document.addEventListener('DOMContentLoaded', () => {
  document.addEventListener('mousedown', (e) => {
    if (shouldStartDrag(e)) {
      startDragWithDelay();
    }
  });

  document.addEventListener('mouseup', stopDragging);
});

function shouldStartDrag(e) {
  if (dragKey === 'left' && e.button === 0) return true;
  if (dragKey === 'right' && e.button === 2) return true;
  if (dragKey === 'ctrl' && e.ctrlKey) return true;
  if (dragKey === 'shift' && e.shiftKey) return true;
  if (dragKey === 'alt' && e.altKey) return true;
  if (dragKey === 'space' && e.code === 'Space') return true;
  if (['q','e','f'].includes(dragKey) && e.key?.toLowerCase() === dragKey) return true;

  return false;
}

function startDragWithDelay() {
  setTimeout(() => {
    dragEnabled = true;
    dragLoop();
  }, dragDelay * 1000);
}

function stopDragging() {
  dragEnabled = false;
}

function dragLoop() {
  if (!dragEnabled) return;


  console.log("Dragging at speed:", dragSpeed);

  setTimeout(dragLoop, 1000 / dragSpeed);
}

function saveAutonomicSettings() {
  const delay = parseInt(document.getElementById("drag-delay").value);
  const speed = parseInt(document.getElementById("drag-speed").value);
  const key = document.getElementById("drag-key").value;

  console.log("Saving Autonomic Settings:", { delay, speed, key });

  fetch("/save_autonomic_settings", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
    },
    body: JSON.stringify({ delay, speed, key })
  })
  .then(response => {
    if (!response.ok) throw new Error("Failed to save settings");
    return response.text();
  })
  .then(data => {
    alert("Settings saved successfully!");
  })
  .catch(error => {
    alert("Error saving settings: " + error.message);
  });
}

    function generateKeyList() {
      const keys = [];
      for (let i = 65; i <= 90; i++) {
        keys.push(String.fromCharCode(i));
      }
      for (let i = 48; i <= 57; i++) {
        keys.push(String.fromCharCode(i));
      }

      for (let i = 1; i <= 12; i++) {
        keys.push(`F${i}`);
      }
      return keys;
    }

    function populateKeySelects() {
      const keys = generateKeyList();
      const selectIds = ['aimbot-key', 'sniper-scope-key', 'sniper-switch-key'];
      
      selectIds.forEach(id => {
        const select = document.getElementById(id);
        select.innerHTML = '';
        
        keys.forEach(key => {
          const option = document.createElement('option');
          option.value = key;
          option.textContent = key;
          select.appendChild(option);
        });
        
  
        if (id === 'aimbot-key') select.value = keybinds.aimbot;
        if (id === 'sniper-scope-key') select.value = keybinds.sniperScope;
        if (id === 'sniper-switch-key') select.value = keybinds.sniperSwitch;
      });
    }

    function enableHotkeys() {
      hotkeyEnabled = true;
      document.getElementById('enable-hotkey').classList.add('bg-blue-600', 'text-white');
      document.getElementById('disable-hotkey').classList.remove('bg-blue-600', 'text-white');
      document.getElementById('disable-hotkey').classList.add('bg-gray-800', 'text-gray-400');
      document.getElementById('enable-hotkey').classList.remove('bg-gray-800', 'text-gray-400');
      updateConsole('Hotkeys enabled');
    }

    function disableHotkeys() {
      hotkeyEnabled = false;
      document.getElementById('disable-hotkey').classList.add('bg-blue-600', 'text-white');
      document.getElementById('enable-hotkey').classList.remove('bg-blue-600', 'text-white');
      document.getElementById('enable-hotkey').classList.add('bg-gray-800', 'text-gray-400');
      document.getElementById('disable-hotkey').classList.remove('bg-gray-800', 'text-gray-400');
      updateConsole('Hotkeys disabled');
    }

    function handleKeyDown(event) {
      if (!hotkeyEnabled) return;
      
      const key = event.key.toUpperCase();
      if (pressedKeys.has(key)) return;
      
      pressedKeys.add(key);

      if (key === keybinds.aimbot) {
        hotkeyStates.aimbot = !hotkeyStates.aimbot;
        sendCommand(hotkeyStates.aimbot ? 'aimbotvisible' : 'aimbotvisibleoff');
        updateConsole(`Aimbot ${hotkeyStates.aimbot ? 'enabled' : 'disabled'} via hotkey`);
      } 
    }

    function handleKeyUp(event) {
      const key = event.key.toUpperCase();
      pressedKeys.delete(key);
    }

    function updateKeybind(type, value) {
      keybinds[type] = value;
      updateConsole(`${type.replace(/([A-Z])/g, ' $1')} key set to ${value}`);
    }

    async function sendCommand(command) {
  const response = await fetch('/execute', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ command: command }),
  });

  const result = await response.json();
  const messages = result.messages;

  if (Array.isArray(messages)) {
    messages.forEach(msg => updateConsole(msg));
  } else {
    updateConsole(messages || "Unknown response");
  }
}

function updateConsole(message) {
  const consoleElement = document.getElementById('console');
  const now = new Date();
  const timeString = now.toLocaleTimeString();
  const fullMessage = `[${timeString}] ${message}`;
  consoleElement.value += fullMessage + '\n';
  consoleElement.scrollTop = consoleElement.scrollHeight;
}


    function toggleUser_Tab() {
      const userTab = document.getElementById('user-tab');
      isTabOpen = !isTabOpen;
      userTab.classList.toggle('hidden', !isTabOpen);
      userTab.classList.toggle('max-h-0', !isTabOpen);
      userTab.classList.toggle('max-h-40', isTabOpen);
    }

    function closeAlert() {
      const alertBar = document.getElementById('alert-bar');
      alertBar.style.display = 'none';
    }

    function redirectToSupport() {
      window.location.href = 'https://discord.gg/2h5YW6ZY';
    }

    function showTab(tab) {
      const tabs = document.querySelectorAll('.tab-content');
      tabs.forEach(t => {
        t.id === tab ? t.classList.remove('hidden') : t.classList.add('hidden');
      });
    }

    function handleComboBoxChange(event) {
      selectedPosition = event.target.value;
      console.log("Selected Aim Position:", selectedPosition);
    }

    function toggleButtonState(button) {
      const siblingButtons = button.parentNode.children;
      for (let sibling of siblingButtons) {
        if (sibling !== button) {
          sibling.classList.remove('bg-blue-600', 'text-white');
          sibling.classList.add('bg-gray-800', 'text-gray-400');
        }
      }
      button.classList.toggle('bg-blue-600');
      button.classList.toggle('text-white');
      button.classList.toggle('bg-gray-800');
      button.classList.toggle('text-gray-400');
    }

    function enableHeadshotLegit() {
      if (selectedPosition) {
        headshotEnabled = true;
        sendCommand('leftShoulderOn');
        sendCommand('rightShoulderOff');
        document.querySelector('#headshot .enable-button').classList.add('bg-blue-600', 'text-white');
        document.querySelector('#headshot .disable-button').classList.remove('bg-blue-600', 'text-white');
      } else {
        console.log("No aim position selected.");
      }
    }

    async function checkPlayerStatus() {
      try {
        const response = await fetch('/check-hd-player-status');
        const result = await response.json();

        const statusElement = document.getElementById('status');
        const pingElement = document.getElementById('ping');

        if (result.isRunning) {
          statusElement.textContent = 'Online';
          statusElement.classList.remove('bg-red-600', 'text-red-100');
          statusElement.classList.add('bg-green-600', 'text-green-100');
        } else {
          statusElement.textContent = 'Offline';
          statusElement.classList.remove('bg-green-600', 'text-green-100');
          statusElement.classList.add('bg-red-600', 'text-red-100');
        }

        pingElement.textContent = `v1.7 (Supreme) · ${typeof result.ping === 'number' ? result.ping : '--'} ms`;

      } catch (error) {
        console.error('Error fetching status:', error);
        document.getElementById('status').textContent = 'Error';
        document.getElementById('status').classList.remove('bg-green-600', 'text-green-100');
        document.getElementById('status').classList.add('bg-red-600', 'text-red-100');
      }
    }

    function startStatusMonitor() {
      checkPlayerStatus();
      playerStatusInterval = setInterval(checkPlayerStatus, 5000);
    }

    function disableHeadshotLegit() {
      headshotEnabled = false;
       sendCommand('leftShoulderOff');
        sendCommand('rightShoulderOff');
      document.querySelector('#headshot .disable-button').classList.add('bg-blue-600', 'text-white');
      document.querySelector('#headshot .enable-button').classList.remove('bg-blue-600', 'text-white');
    }

    function enableSniper() {
      sniperEnabled = true;
      sendCommand('sniperscopeon');
      document.querySelector('#sniper .enable-sniper-button').classList.add('bg-blue-600', 'text-white');
      document.querySelector('#sniper .disable-sniper-button').classList.remove('bg-blue-600', 'text-white');
    }

    function disableSniper() {
      sniperEnabled = false;
      sendCommand('sniperscopeoff');
      document.querySelector('#sniper .disable-sniper-button').classList.add('bg-blue-600', 'text-white');
      document.querySelector('#sniper .enable-sniper-button').classList.remove('bg-blue-600', 'text-white');
    }

    function loadButtonClicked(button) {
      button.classList.add('bg-blue-600', 'text-white');
      button.classList.remove('bg-gray-800', 'text-gray-400');
    }

    function toggleAimbotVersion(version) {
      aimbotVersion = version;
      console.log("Selected Aimbot Version:", aimbotVersion);
    }

    function enableAimbot() {
      if (aimbotVersion === 'version1') {
        sendCommand('aimbotenable');
      } else {
        sendCommand('aimbotvisible');
      }
    }

    function disableAimbot() {
      if (aimbotVersion === 'version1') {
        sendCommand('aimbotdisable');
      } else {
        sendCommand('aimbotvisibleoff');
      }
    }

    document.addEventListener('DOMContentLoaded', function() {
      populateKeySelects();
      
      document.addEventListener('keydown', handleKeyDown);
      document.addEventListener('keyup', handleKeyUp);

      fetch('/user-info')
        .then(res => res.json())
        .then(data => {
          if (!data.error) {
            document.getElementById("username").innerText = data.username;
            document.getElementById("expiry-date").innerText = data.expiry;
          }
        });

      startStatusMonitor();
      
      document.getElementById('enable-hotkey').classList.add('bg-gray-800', 'text-gray-400');
      document.getElementById('disable-hotkey').classList.add('bg-blue-600', 'text-white');
    });

  </script>
